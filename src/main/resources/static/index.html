<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvalForge AI</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f3;color:#17202e;font:16px system-ui}main{max-width:1050px;margin:auto;padding:60px 24px}.tag{font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#6b4eff}h1{font:800 clamp(44px,7vw,80px)/.98 system-ui;margin:14px 0}.lead{font-size:19px;color:#5b6575;max-width:740px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}.card{background:white;border:1px solid #ded9cf;border-radius:18px;padding:20px;box-shadow:0 12px 40px #25304a10}.score{font-size:38px;font-weight:800}button{background:#17202e;color:white;border:0;border-radius:10px;padding:14px 19px;font-weight:800;cursor:pointer}.wide{grid-column:span 3}.bar{height:8px;background:#ebe7df;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6b4eff,#16b8a6)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main><div class="tag">RAG quality engineering</div><h1>Measure answers.<br>Block regressions.</h1><p class="lead">A deterministic evaluation workbench for groundedness, context relevance, citation precision, expected-answer completeness and latency budgets.</p><button id="run">Evaluate golden case →</button><section class="grid"><article class="card"><div class="tag">Quality gate</div><div class="score" id="status">READY</div></article><article class="card"><div class="tag">Overall</div><div class="score" id="overall">—</div></article><article class="card"><div class="tag">Flags</div><div id="flags">Waiting for a run.</div></article><article class="card wide" id="metrics"><div class="tag">Metric breakdown</div></article></section></main><script>run.onclick=async()=>{status.textContent='RUNNING';let d=await fetch('/api/evaluations/demo').then(r=>r.json());status.textContent=d.status;overall.textContent=Math.round(d.overall*100)+'%';flags.textContent=d.flags.join(' · ');metrics.innerHTML='<div class="tag">Metric breakdown</div>'+[['Groundedness',d.groundedness],['Context relevance',d.contextRelevance],['Citation precision',d.citationPrecision],['Completeness',d.completeness],['Latency',d.latencyScore]].map(x=>`<p><b>${x[0]}</b> · ${Math.round(x[1]*100)}%</p><div class="bar"><i style="width:${x[1]*100}%"></i></div>`).join('')}</script></body></html>
